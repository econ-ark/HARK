name: Test examples

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

# Runs pre-merge (push/PR against main) as well as nightly, so a PR that
# breaks an example notebook is caught before merge rather than by the next
# cron run.
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  schedule:
    - cron: 0 0 * * *

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Single version on purpose. This job executes every example
      # notebook, which is the most expensive thing in CI, and it exists
      # to catch examples that have gone stale against the library, not
      # to sweep the supported Python range -- hark.yml already does that.
      # 3.13 matches the other two cron workflows, execute-notebooks.yml
      # and weekly.yml, so all three agree on one interpreter.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run examples
        run: |
          pytest --nbval-lax --nbval-current-env --dist loadscope -n auto examples/
