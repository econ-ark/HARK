name: Version from git

# HARK's version comes from git's tags (setuptools_scm; see pyproject.toml).
# This builds wheels at test tags, and one commit after them, in a clone of the
# checkout, and checks the Version in each wheel's METADATA.

on: [push, pull_request]

jobs:
  wheel-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm takes HARK's version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install build setuptools "setuptools_scm>=8" packaging
      - name: The wheels' versions at tags and after them
        run: python tools/check_wheel_versions.py
