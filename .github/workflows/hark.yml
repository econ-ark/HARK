name: HARK build on MacOS, Ubuntu and Windows

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Never cancel a run on main. Consecutive merges were cancelling each
    # other, so main's build almost never reached a conclusion and a real
    # test failure sat unreported. Feature branches still supersede.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      # One failing cell used to cancel every other cell, which leaves a
      # single data point and invites the wrong diagnosis.
      fail-fast: false
      # SPEC 0 (scientific-python.org/specs/spec-0000) drops a Python version
      # 3 years after release, so the window is currently 3.12 / 3.13 / 3.14.
      # numpy and scipy both require >= 3.12, so testing anything older tested
      # a dependency stack HARK does not ship against rather than HARK itself.
      # Sweep the window on Linux; the other two platforms cover the middle,
      # since cross-OS breakage here is path and newline related, not version
      # specific.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test with pytest
        run: |
          pytest -n auto
