name: HARK build on MacOS, Ubuntu and Windows

concurrency:
    # Every commit on main gets its own concurrency group, so no run on main is
    # ever superseded. cancel-in-progress: false is not enough on its own:
    # GitHub still allows only one running plus one PENDING run per group, and
    # a third arrival discards the pending one. Five merges in half an hour
    # therefore left most commits on main with no build at all, and the ones
    # that did run reported "cancelled" with zero jobs, which reads like a
    # failure rather than like never having started. A genuine test failure sat
    # unreported for hours behind this.
    #
    # Feature branches keep one group per ref and still supersede, which is
    # what you want while iterating on a PR.
    group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/documentation.yml"
      - "docs/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      # One failing cell used to cancel every other cell, which leaves a
      # single data point and invites the wrong diagnosis.
      fail-fast: false
      # SPEC 0 (scientific-python.org/specs/spec-0000) drops a Python version
      # 3 years after release, so the window is currently 3.12 / 3.13 / 3.14.
      # numpy and scipy both require >= 3.12, so testing anything older tested
      # a dependency stack HARK does not ship against rather than HARK itself.
      # Sweep the window on Linux; the other two platforms cover the middle,
      # since cross-OS breakage here is path and newline related, not version
      # specific.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test with pytest
        run: |
          pytest -n auto
