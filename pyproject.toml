[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-ark"
authors = [{name = "Econ-ARK team", email = "econ-ark@jhuecon.org"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Other/Nonlisted Topic",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
description = "Heterogenous Agents Resources & toolKit"
keywords = ["economics", "modelling", "modeling", "heterogeneity"]
requires-python = ">=3.12"
dynamic = ["version", "dependencies", "optional-dependencies"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools_scm]
# The version comes from git. A release's version is its tag, such as 0.17.2;
# every commit after a release gets its own development version, so pip can
# tell an install from main apart from the release before it. On main the
# development versions count toward the next minor release (0.18.0.dev270+g...);
# on a release branch named for its series, 0.17 or release/0.17, toward the
# series' next patch (0.17.3.dev...).
# Before tagging a release, work through the "Before release" list in the dev
# section of docs/CHANGELOG.md, if there is one.
version_file = "HARK/_version.py"
version_scheme = "release-branch-semver"
# Only release tags count (0.17.2, 0.18.0rc1, ...), not tags such as
# v0.17.0.post1-broadcasting-fix or pins for other projects.
tag_regex = '^(?P<version>\d+\.\d+(?:\.\d+)?(?:(?:a|b|rc)\d+)?)$'

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "[0-9]*.[0-9]*"]

[tool.setuptools.dynamic.dependencies]
file = "requirements/base.txt"

[tool.setuptools.dynamic.optional-dependencies]
dev.file = "requirements/dev.txt"
doc.file = "requirements/doc.txt"

[project.urls]
Homepage = "https://github.com/econ-ark/HARK"
"Bug Reports" = "https://github.com/econ-ark/HARK/issues"
Documentation = "https://econ-ark.github.io/HARK"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages.find]
exclude = ["binder", "docs", "examples", "tests*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.csv", "*.txt"]

[tool.ruff]
extend-include = ["*.ipynb"]
[tool.ruff.lint]
ignore = ["E731", "E721", "E402", "F841", "F821", "F405", "F403", "E722", "E741", "F811"]
